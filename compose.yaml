name: ecoflow

# Публікується назовні через ecoflow-cloudflared.service (працює на хості).
# Порт 3001 лишається тим самим, що слухав systemd-процес до переїзду.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecoflow-dashboard:local
    container_name: ecoflow-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Kyiv
      NODE_ENV: production
      # BLE-міст нижче; без нього панель працює лише через хмару
      ECOFLOW_BLE_BRIDGE_URL: http://ble-bridge:8765
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # база телеметрії лишається на диску хоста, поза образом
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    mem_limit: 1g

  # Пряме з'єднання з EcoFlow по Bluetooth (BLE-донгл на цьому хості).
  # Говорить із bluetoothd хоста через системний D-Bus, тож не потребує
  # network_mode: host чи privileged (лише AppArmor-виняток нижче). Порт назовні не публікується: його бачить
  # лише контейнер панелі всередині мережі compose.
  ble-bridge:
    build:
      context: ./ble-bridge
    image: ecoflow-ble-bridge:local
    container_name: ecoflow-ble-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Kyiv
    # Стандартний AppArmor-профіль Docker (docker-default) забороняє контейнеру
    # слати повідомлення в системний D-Bus, а без нього bluetoothd недосяжний.
    # Знімаємо обмеження лише для цього контейнера.
    security_opt:
      - apparmor:unconfined
    volumes:
      - /run/dbus:/run/dbus:ro
      # кеш user ID акаунта EcoFlow, щоб міст стартував і без інтернету
      - ./server/data/ble:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    mem_limit: 256m
