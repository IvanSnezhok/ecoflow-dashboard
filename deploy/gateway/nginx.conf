# Gateway in front of the panel (compose service "gateway").
#
# cloudflared talks to this nginx on 127.0.0.1:3001 instead of the panel itself, so
# while the panel's container is being replaced (an update, a restart, a crash) the
# visitor gets updating.html with the update's stage instead of Cloudflare's 502.
# The page follows status.json, which deploy/host-updater.sh writes next to this file.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  # Docker's DNS, asked at request time: the panel's container gets a new address on
  # every update, and nginx must also start while it does not exist.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 3001;
    set $panel http://dashboard:3001;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Server-sent events (update progress) and live data must not wait in a buffer
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    # /ws stays open for hours; the data access check alone answers after 45 s
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Only errors nginx itself raises (panel unreachable) are replaced: a 5xx the
    # panel answers with passes through as it is.
    location / {
      proxy_pass $panel;
      error_page 502 503 504 =503 /__update/page;
    }

    # API and WebSocket callers get JSON, not a page
    location ~ ^/(api/|ws$) {
      proxy_pass $panel;
      error_page 502 503 504 =503 /__update/unavailable;
    }

    location = /__update/page {
      internal;
      alias /etc/nginx/gateway/updating.html;
      default_type text/html;
      charset utf-8;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "5" always;
      add_header X-Robots-Tag "noindex" always;
    }

    location = /__update/unavailable {
      internal;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "5" always;
      return 503 '{"error":"The panel is restarting","updating":true}';
    }

    # Stage of the running update: step, progress, times and the short commit only
    location = /__update/status.json {
      alias /etc/nginx/gateway/status.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }
  }
}
